<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Hell - AI Boss</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #fff; overflow: hidden; user-select: none; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Shift'].includes(e.key)) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ============ ARENA ============
const ARENA = { w: 340, h: 340 };
function ax() { return (canvas.width - ARENA.w) / 2; }
function ay() { return (canvas.height - ARENA.h) / 2 + 50; }

// ============ GAME STATE ============
const PHASES = 3;
const WAVES_PER_PHASE = 5;
const TOTAL_WAVES = PHASES * WAVES_PER_PHASE;
const WAVE_DURATION = 60 * 12; // 12 seconds per wave

let state = 'title'; // title, wave, waveEnd, pickPower, bossDefeat, dead
let wave = 0;
let phase = 0;
let waveTimer = 0;
let frameCount = 0;
let deathCount = 0;
let bossHP = TOTAL_WAVES;
let bossMaxHP = TOTAL_WAVES;
let transitionTimer = 0;
let shakeAmount = 0;

// Player
let px, py, pSpeed, pSize, pAlive;
let shield = 0;
let dashCooldown = 0;
let dashTimer = 0;
let hasDash = false;
let slowMult = 1; // bullet speed multiplier
let powerups = []; // active powerup names

// Bullets
let bullets = [];
let particles = [];

// Pattern tracking - AI learns which patterns kill the player
// patternDeaths[i] = how many times player died during pattern i
const patternDeaths = new Array(12).fill(0);
const patternUses = new Array(12).fill(0);

// ============ POWERUP DEFS ============
const POWERUP_DEFS = [
  { id: 'shrink', name: 'SHRINK', desc: 'Smaller hitbox', icon: '◇', color: '#0ff',
    apply: () => { pSize = Math.max(4, pSize - 2); } },
  { id: 'speed', name: 'SPEED+', desc: 'Move faster', icon: '»', color: '#0f0',
    apply: () => { pSpeed += 0.8; } },
  { id: 'slow', name: 'SLOW BULLETS', desc: 'All bullets slower', icon: '◎', color: '#ff0',
    apply: () => { slowMult *= 0.8; } },
  { id: 'shield', name: 'SHIELD', desc: 'Survive 1 hit', icon: '○', color: '#48f',
    apply: () => { shield++; } },
  { id: 'dash', name: 'DASH', desc: 'Shift to dash (dodge)', icon: '⇒', color: '#f0f',
    apply: () => { hasDash = true; } },
];

let powerupChoices = [];
let selectedPowerup = -1;

function resetPlayer() {
  px = ax() + ARENA.w / 2;
  py = ay() + ARENA.h / 2;
  pSpeed = 3.2;
  pSize = 8;
  pAlive = true;
  shield = 0;
  dashCooldown = 0;
  dashTimer = 0;
  hasDash = false;
  slowMult = 1;
  powerups = [];
}

function resetGame() {
  wave = 0;
  phase = 0;
  bossHP = TOTAL_WAVES;
  deathCount = 0;
  bullets = [];
  particles = [];
  patternDeaths.fill(0);
  patternUses.fill(0);
  resetPlayer();
}

// ============ PATTERNS (always beatable) ============
// Each pattern is a function(timer, ax, ay, w, h) that spawns bullets
// timer goes from WAVE_DURATION down to 0

function patternRainColumns(t, x, y, w, h) {
  // Columns of bullets with a moving gap
  if (t % 12 !== 0) return;
  const gapCol = Math.floor((Math.sin(t * 0.03) * 0.5 + 0.5) * 8);
  for (let i = 0; i < 9; i++) {
    if (i === gapCol || i === gapCol + 1) continue;
    const bx = x + (i / 9) * w + w / 18;
    bullets.push({ x: bx, y: y - 5, vx: 0, vy: 2.2 * slowMult, r: 4, c: '#f44', life: 300 });
  }
}

function patternSpiralSingle(t, x, y, w, h) {
  if (t % 8 !== 0) return;
  const cx = x + w / 2, cy = y + h / 2;
  const a = t * 0.08;
  const spd = 1.8 * slowMult;
  bullets.push({ x: cx, y: cy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4, c: '#f80', life: 250 });
}

function patternSideSweep(t, x, y, w, h) {
  if (t % 20 !== 0) return;
  const fromLeft = Math.floor(t / 20) % 2 === 0;
  const gapRow = Math.floor((Math.sin(t * 0.02) * 0.5 + 0.5) * 7);
  for (let i = 0; i < 8; i++) {
    if (i === gapRow) continue;
    const by = y + (i / 8) * h + h / 16;
    bullets.push({ x: fromLeft ? x - 5 : x + w + 5, y: by, vx: (fromLeft ? 1 : -1) * 2.5 * slowMult, vy: 0, r: 4, c: '#ff0', life: 250 });
  }
}

function patternDiamondExpand(t, x, y, w, h) {
  if (t % 40 !== 0) return;
  const cx = x + w / 2, cy = y + h / 2;
  const spd = 1.5 * slowMult;
  const count = 12;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + t * 0.01;
    bullets.push({ x: cx, y: cy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4, c: '#4ff', life: 200 });
  }
}

// Phase 2 patterns
function patternDoubleSpiralP2(t, x, y, w, h) {
  if (t % 6 !== 0) return;
  const cx = x + w / 2, cy = y + h / 2;
  const spd = 2 * slowMult;
  for (let s = 0; s < 2; s++) {
    const a = t * 0.1 + s * Math.PI;
    bullets.push({ x: cx, y: cy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4, c: '#f0f', life: 250 });
  }
}

function patternAimedBurstP2(t, x, y, w, h) {
  if (t % 30 !== 0) return;
  const bossX = x + w / 2, bossY = y - 10;
  const angle = Math.atan2(py - bossY, px - bossX);
  const spd = 2.8 * slowMult;
  // Spread of 5 bullets with gaps big enough to dodge
  for (let i = -2; i <= 2; i++) {
    const a = angle + i * 0.25;
    bullets.push({ x: bossX, y: bossY, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4, c: '#f44', life: 250 });
  }
}

function patternCheckerRainP2(t, x, y, w, h) {
  if (t % 15 !== 0) return;
  const flip = Math.floor(t / 60) % 2;
  for (let i = 0; i < 10; i++) {
    if ((i + flip) % 2 === 0) continue;
    const bx = x + (i / 10) * w + w / 20;
    bullets.push({ x: bx, y: y - 5, vx: 0, vy: 2.5 * slowMult, r: 4, c: '#ff0', life: 300 });
  }
}

function patternBouncingWallsP2(t, x, y, w, h) {
  if (t % 35 !== 0) return;
  const fromLeft = Math.random() < 0.5;
  const by = y + Math.random() * h * 0.6 + h * 0.2;
  const spd = 2.2 * slowMult;
  bullets.push({ x: fromLeft ? x - 5 : x + w + 5, y: by, vx: (fromLeft ? 1 : -1) * spd, vy: (Math.random() - 0.5) * spd * 0.6, r: 5, c: '#f80', life: 400, bounce: 2 });
}

// Phase 3 patterns
function patternTripleSpiralP3(t, x, y, w, h) {
  if (t % 6 !== 0) return;
  const cx = x + w / 2, cy = y + h / 2;
  const spd = 2.2 * slowMult;
  for (let s = 0; s < 3; s++) {
    const a = t * 0.12 + s * (Math.PI * 2 / 3);
    bullets.push({ x: cx, y: cy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 3, c: '#f4f', life: 220 });
  }
}

function patternCrossRotateP3(t, x, y, w, h) {
  if (t % 10 !== 0) return;
  const cx = x + w / 2, cy = y + h / 2;
  const base = t * 0.04;
  const spd = 2 * slowMult;
  for (let arm = 0; arm < 4; arm++) {
    const a = base + arm * Math.PI / 2;
    bullets.push({ x: cx, y: cy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4, c: '#ff4', life: 250 });
  }
}

function patternSlowHomingP3(t, x, y, w, h) {
  if (t % 50 !== 0) return;
  // Spawn from random edge
  const side = Math.floor(Math.random() * 4);
  let bx, by;
  if (side === 0) { bx = x + Math.random() * w; by = y - 5; }
  else if (side === 1) { bx = x + Math.random() * w; by = y + h + 5; }
  else if (side === 2) { bx = x - 5; by = y + Math.random() * h; }
  else { bx = x + w + 5; by = y + Math.random() * h; }
  bullets.push({ x: bx, y: by, vx: 0, vy: 0, r: 6, c: '#f00', life: 300, homing: true, hspd: 1.2 * slowMult });
}

function patternBarrageP3(t, x, y, w, h) {
  // Combo: rain + side bullets, but with clear safe lanes
  if (t % 10 === 0) {
    // Rain with 2 gaps
    const gap1 = Math.floor((Math.sin(t * 0.04) * 0.5 + 0.5) * 7);
    const gap2 = (gap1 + 4) % 8;
    for (let i = 0; i < 8; i++) {
      if (i === gap1 || i === gap2) continue;
      const bx = x + (i / 8) * w + w / 16;
      bullets.push({ x: bx, y: y - 5, vx: 0, vy: 2.5 * slowMult, r: 3, c: '#f44', life: 250 });
    }
  }
  if (t % 25 === 0) {
    const fromLeft = t % 50 === 0;
    const by = y + h * 0.3 + Math.sin(t * 0.03) * h * 0.2;
    bullets.push({ x: fromLeft ? x - 5 : x + w + 5, y: by, vx: (fromLeft ? 1 : -1) * 2.8 * slowMult, vy: 0, r: 4, c: '#ff0', life: 250 });
  }
}

const ALL_PATTERNS = [
  // Phase 1 (indices 0-3)
  patternRainColumns,
  patternSpiralSingle,
  patternSideSweep,
  patternDiamondExpand,
  // Phase 2 (indices 4-7)
  patternDoubleSpiralP2,
  patternAimedBurstP2,
  patternCheckerRainP2,
  patternBouncingWallsP2,
  // Phase 3 (indices 8-11)
  patternTripleSpiralP3,
  patternCrossRotateP3,
  patternSlowHomingP3,
  patternBarrageP3,
];

const PATTERN_NAMES = [
  'Rain', 'Spiral', 'Sweep', 'Diamond',
  'Double Spiral', 'Aimed Burst', 'Checker', 'Bouncing',
  'Triple Spiral', 'Cross', 'Homing', 'Barrage'
];

// ============ AI PATTERN SELECTION ============
function getAvailablePatterns() {
  const end = Math.min((phase + 1) * 4, 12);
  const available = [];
  for (let i = 0; i < end; i++) available.push(i);
  return available;
}

function pickPattern() {
  const available = getAvailablePatterns();

  // Weight by death rate: patterns that killed the player more get picked more
  const weights = available.map(i => {
    const deaths = patternDeaths[i];
    const uses = patternUses[i] || 1;
    // Base weight + bonus for kill rate
    return 1 + (deaths / uses) * 5 + deaths * 0.5;
  });

  // Also boost patterns that haven't been tried much (exploration)
  for (let i = 0; i < weights.length; i++) {
    if (patternUses[available[i]] < 2) weights[i] += 3;
  }

  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return available[i];
  }
  return available[available.length - 1];
}

let currentPattern = 0;
let currentPatternName = '';

// ============ BOSS ============
const boss = { x: 0, y: 0, w: 90, h: 55, shake: 0, mouth: 0 };

function drawBoss() {
  const a = ax(), aY = ay();
  boss.x = canvas.width / 2 - boss.w / 2 + Math.sin(frameCount * 0.015) * 25;
  boss.y = aY - boss.h - 25;

  const sx = boss.shake > 0.5 ? (Math.random() - 0.5) * boss.shake : 0;
  const sy = boss.shake > 0.5 ? (Math.random() - 0.5) * boss.shake : 0;
  boss.shake *= 0.92;
  boss.mouth *= 0.93;

  const bx = boss.x + sx, by = boss.y + sy;

  // Phase color
  const phaseColors = ['#555', '#833', '#a22'];
  const eyeColors = ['#800', '#f40', '#f00'];
  const glowColors = ['rgba(255,50,50,0.1)', 'rgba(255,100,0,0.2)', 'rgba(255,0,0,0.35)'];

  // Glow
  ctx.shadowColor = glowColors[phase];
  ctx.shadowBlur = 15 + phase * 10;

  // Body
  ctx.fillStyle = phaseColors[phase];
  ctx.strokeStyle = '#f44';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(bx, by, boss.w, boss.h, 10);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Horns (bigger each phase)
  ctx.fillStyle = '#666';
  const hornH = 18 + phase * 8;
  ctx.beginPath();
  ctx.moveTo(bx + 10, by); ctx.lineTo(bx - 5, by - hornH); ctx.lineTo(bx + 22, by);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx + boss.w - 10, by); ctx.lineTo(bx + boss.w + 5, by - hornH); ctx.lineTo(bx + boss.w - 22, by);
  ctx.fill();

  // Eyes
  const lookX = Math.max(-4, Math.min(4, (px - bx - boss.w / 2) * 0.02));
  const lookY = Math.max(-3, Math.min(3, (py - by - boss.h / 2) * 0.015));

  for (const ex of [24, boss.w - 24]) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(bx + ex, by + 20, 11, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = eyeColors[phase];
    ctx.beginPath();
    ctx.arc(bx + ex + lookX, by + 20 + lookY, 4 + phase, 0, Math.PI * 2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(bx + ex + lookX * 1.2, by + 20 + lookY * 1.2, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Mouth
  const mOpen = Math.max(3, boss.mouth);
  ctx.fillStyle = '#200';
  ctx.beginPath();
  ctx.ellipse(bx + boss.w / 2, by + 42, 14, mOpen * 0.5 + 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // HP bar above boss
  const hpW = 200;
  const hpX = canvas.width / 2 - hpW / 2;
  const hpY = by - 20;
  ctx.fillStyle = '#333';
  ctx.fillRect(hpX, hpY, hpW, 10);
  const hpFrac = bossHP / bossMaxHP;
  const hpColor = hpFrac > 0.5 ? '#f44' : hpFrac > 0.25 ? '#f80' : '#ff0';
  ctx.fillStyle = hpColor;
  ctx.fillRect(hpX, hpY, hpW * hpFrac, 10);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(hpX, hpY, hpW, 10);

  // Phase label
  ctx.font = '11px monospace';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  ctx.fillText(`Phase ${phase + 1} — Wave ${(wave % WAVES_PER_PHASE) + 1}/${WAVES_PER_PHASE}`, canvas.width / 2, hpY - 6);
  ctx.textAlign = 'left';
}

// ============ PARTICLES ============
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 30 + Math.random() * 20, maxLife: 50, c: color, r: 2 + Math.random() * 2 });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============ UPDATE ============
function updateWave() {
  const a = ax(), aY = ay();

  // Player movement
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a']) dx = -1;
  if (keys['ArrowRight'] || keys['d']) dx = 1;
  if (keys['ArrowUp'] || keys['w']) dy = -1;
  if (keys['ArrowDown'] || keys['s']) dy = 1;

  // Normalize diagonal
  if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

  // Dash
  if (hasDash && (keys['Shift'] || keys[' ']) && dashCooldown <= 0 && (dx !== 0 || dy !== 0)) {
    dashTimer = 6;
    dashCooldown = 60;
  }
  if (dashCooldown > 0) dashCooldown--;

  const spd = dashTimer > 0 ? pSpeed * 3.5 : pSpeed;
  if (dashTimer > 0) dashTimer--;

  px += dx * spd;
  py += dy * spd;

  // Clamp to arena
  px = Math.max(a + pSize, Math.min(a + ARENA.w - pSize, px));
  py = Math.max(aY + pSize, Math.min(aY + ARENA.h - pSize, py));

  // Spawn bullets from current pattern
  ALL_PATTERNS[currentPattern](waveTimer, a, aY, ARENA.w, ARENA.h);

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    // Homing
    if (b.homing) {
      const angle = Math.atan2(py - b.y, px - b.x);
      b.vx += Math.cos(angle) * 0.04;
      b.vy += Math.sin(angle) * 0.04;
      const mag = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (mag > b.hspd) { b.vx = b.vx / mag * b.hspd; b.vy = b.vy / mag * b.hspd; }
    }

    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    // Bouncing
    if (b.bounce && b.bounce > 0) {
      if (b.x < a || b.x > a + ARENA.w) { b.vx *= -1; b.bounce--; b.x = Math.max(a, Math.min(a + ARENA.w, b.x)); }
      if (b.y < aY || b.y > aY + ARENA.h) { b.vy *= -1; b.bounce--; b.y = Math.max(aY, Math.min(aY + ARENA.h, b.y)); }
    }

    // Remove if out of arena or expired
    if (b.life <= 0 || b.x < a - 40 || b.x > a + ARENA.w + 40 || b.y < aY - 40 || b.y > aY + ARENA.h + 40) {
      bullets.splice(i, 1);
      continue;
    }

    // Collision (skip during dash)
    if (dashTimer > 0) continue;
    const ddx = b.x - px, ddy = b.y - py;
    if (ddx * ddx + ddy * ddy < (pSize + b.r) * (pSize + b.r)) {
      if (shield > 0) {
        shield--;
        bullets.splice(i, 1);
        spawnParticles(px, py, '#48f', 10);
        shakeAmount = 5;
        continue;
      }
      // Death
      pAlive = false;
      deathCount++;
      patternDeaths[currentPattern]++;
      spawnParticles(px, py, '#f44', 25);
      shakeAmount = 15;
      boss.mouth = 25;
      transitionTimer = 120;
      state = 'dead';
      return;
    }
  }

  // Wave timer
  waveTimer--;
  if (waveTimer <= 0) {
    // Wave survived!
    bossHP--;
    boss.shake = 12;
    bullets = [];
    spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, '#ff0', 15);

    if (bossHP <= 0) {
      state = 'bossDefeat';
      transitionTimer = 180;
      spawnParticles(boss.x + boss.w / 2, boss.y + boss.h / 2, '#ff0', 40);
      return;
    }

    wave++;
    phase = Math.min(PHASES - 1, Math.floor(wave / WAVES_PER_PHASE));

    // Offer powerup every 2 waves
    if (wave % 2 === 0 && wave < TOTAL_WAVES) {
      state = 'pickPower';
      generatePowerupChoices();
      transitionTimer = 0;
    } else {
      state = 'waveEnd';
      transitionTimer = 90;
    }
  }
}

function generatePowerupChoices() {
  // Pick 3 random unique powerups
  const shuffled = [...POWERUP_DEFS].sort(() => Math.random() - 0.5);
  powerupChoices = shuffled.slice(0, 3);
  selectedPowerup = -1;
}

function startWave() {
  currentPattern = pickPattern();
  patternUses[currentPattern]++;
  currentPatternName = PATTERN_NAMES[currentPattern];
  waveTimer = WAVE_DURATION;
  bullets = [];
  state = 'wave';
}

function update() {
  frameCount++;
  shakeAmount *= 0.9;
  updateParticles();

  if (state === 'title') {
    if (keys['Enter'] || keys[' ']) {
      resetGame();
      startWave();
    }
  } else if (state === 'wave') {
    updateWave();
  } else if (state === 'waveEnd') {
    transitionTimer--;
    if (transitionTimer <= 0) startWave();
  } else if (state === 'pickPower') {
    // Click or 1/2/3 keys to pick
    if (keys['1'] && powerupChoices[0]) { selectedPowerup = 0; keys['1'] = false; }
    if (keys['2'] && powerupChoices[1]) { selectedPowerup = 1; keys['2'] = false; }
    if (keys['3'] && powerupChoices[2]) { selectedPowerup = 2; keys['3'] = false; }
    if (selectedPowerup >= 0) {
      powerupChoices[selectedPowerup].apply();
      powerups.push(powerupChoices[selectedPowerup].name);
      state = 'waveEnd';
      transitionTimer = 60;
    }
  } else if (state === 'dead') {
    transitionTimer--;
    if (transitionTimer <= 0) {
      // Respawn — keep powerups and progress, just restart current wave
      pAlive = true;
      px = ax() + ARENA.w / 2;
      py = ay() + ARENA.h / 2;
      bullets = [];
      startWave();
    }
  } else if (state === 'bossDefeat') {
    transitionTimer--;
    if (transitionTimer <= 0) {
      state = 'title';
    }
  }
}

// ============ RENDER ============
function render() {
  const cw = canvas.width, ch = canvas.height;

  // Screen shake
  ctx.save();
  if (shakeAmount > 0.5) {
    ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);

  const a = ax(), aY = ay();

  if (state === 'title') {
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#f44';
    ctx.fillText('BULLET HELL', cw / 2, ch / 2 - 80);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('The boss learns your patterns', cw / 2, ch / 2 - 40);
    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    ctx.fillText('Press ENTER to start', cw / 2, ch / 2 + 20);
    ctx.font = '13px monospace';
    ctx.fillStyle = '#555';
    ctx.fillText('Arrow keys to move | Survive 15 waves to win', cw / 2, ch / 2 + 60);
    ctx.textAlign = 'left';
    ctx.restore();
    return;
  }

  if (state === 'bossDefeat') {
    drawBoss();
    drawParticles();
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px monospace';
    ctx.fillStyle = '#ff0';
    ctx.fillText('BOSS DEFEATED!', cw / 2, ch / 2 - 20);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Deaths: ${deathCount}`, cw / 2, ch / 2 + 20);
    ctx.fillText('Press ENTER to play again', cw / 2, ch / 2 + 50);
    ctx.textAlign = 'left';
    if (keys['Enter']) { state = 'title'; }
    ctx.restore();
    return;
  }

  // Arena
  ctx.fillStyle = '#080808';
  ctx.fillRect(a, aY, ARENA.w, ARENA.h);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.strokeRect(a, aY, ARENA.w, ARENA.h);

  // Boss
  drawBoss();

  // Bullets
  for (const b of bullets) {
    ctx.fillStyle = b.c;
    ctx.shadowColor = b.c;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Player
  if (pAlive) {
    ctx.save();
    ctx.translate(px, py);

    // Shield glow
    if (shield > 0) {
      ctx.strokeStyle = '#48f';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.1) * 0.2;
      ctx.beginPath();
      ctx.arc(0, 0, pSize + 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Dash trail
    if (dashTimer > 0) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#0f0';
      ctx.beginPath();
      ctx.arc(0, 0, pSize + 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Ship
    ctx.fillStyle = '#0f0';
    ctx.shadowColor = '#0f0';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(0, -pSize);
    ctx.lineTo(-pSize * 0.8, pSize * 0.6);
    ctx.lineTo(pSize * 0.8, pSize * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  drawParticles();

  // HUD
  ctx.font = '13px monospace';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'left';

  // Wave timer bar
  if (state === 'wave') {
    const barW = ARENA.w;
    const barX = a;
    const barY = aY + ARENA.h + 10;
    ctx.fillStyle = '#222';
    ctx.fillRect(barX, barY, barW, 6);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(barX, barY, barW * (waveTimer / WAVE_DURATION), 6);

    // Pattern name
    ctx.fillStyle = '#555';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`pattern: ${currentPatternName}`, cw / 2, barY + 22);
  }

  // Deaths
  ctx.textAlign = 'left';
  ctx.font = '13px monospace';
  ctx.fillStyle = '#f55';
  ctx.fillText(`Deaths: ${deathCount}`, a, aY + ARENA.h + 45);

  // Active powerups
  if (powerups.length > 0) {
    ctx.fillStyle = '#0ff';
    ctx.textAlign = 'right';
    ctx.fillText(powerups.join(' | '), a + ARENA.w, aY + ARENA.h + 45);
  }

  // Shield count
  if (shield > 0) {
    ctx.fillStyle = '#48f';
    ctx.textAlign = 'left';
    ctx.fillText(`Shield: ${shield}`, a, aY + ARENA.h + 62);
  }

  // Dash cooldown
  if (hasDash) {
    ctx.fillStyle = dashCooldown <= 0 ? '#f0f' : '#555';
    ctx.textAlign = 'right';
    ctx.fillText(dashCooldown <= 0 ? 'DASH READY [Shift]' : `Dash: ${Math.ceil(dashCooldown / 60)}s`, a + ARENA.w, aY + ARENA.h + 62);
  }

  // Controls hint
  ctx.fillStyle = '#333';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('Arrow keys to move' + (hasDash ? ' | Shift to dash' : ''), cw / 2, aY + ARENA.h + 80);

  // AI pattern preference display
  const avail = getAvailablePatterns();
  const maxDeaths = Math.max(1, ...avail.map(i => patternDeaths[i]));
  ctx.textAlign = 'left';
  ctx.font = '10px monospace';
  const panelX = a + ARENA.w + 20;
  const panelY = aY;
  if (panelX + 150 < cw) {
    ctx.fillStyle = '#444';
    ctx.fillText('Boss prefers:', panelX, panelY);
    for (let i = 0; i < avail.length; i++) {
      const pi = avail[i];
      const ratio = patternDeaths[pi] / maxDeaths;
      ctx.fillStyle = pi === currentPattern ? '#fff' : '#555';
      ctx.fillText(PATTERN_NAMES[pi], panelX, panelY + 16 + i * 14);
      // Bar
      ctx.fillStyle = `rgb(${Math.floor(ratio * 255)}, ${Math.floor((1 - ratio) * 100)}, 0)`;
      ctx.fillRect(panelX + 90, panelY + 8 + i * 14, ratio * 50, 8);
    }
  }

  // Powerup pick screen
  if (state === 'pickPower') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, cw, ch);

    ctx.textAlign = 'center';
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#ff0';
    ctx.fillText('CHOOSE A POWER-UP', cw / 2, ch / 2 - 90);

    for (let i = 0; i < powerupChoices.length; i++) {
      const pu = powerupChoices[i];
      const bx = cw / 2 - 150 + i * 150 - 50;
      const by = ch / 2 - 50;
      const bw = 130, bh = 90;

      ctx.fillStyle = '#1a1a1a';
      ctx.strokeStyle = pu.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 8);
      ctx.fill();
      ctx.stroke();

      ctx.font = '24px monospace';
      ctx.fillStyle = pu.color;
      ctx.fillText(pu.icon, bx + bw / 2, by + 30);

      ctx.font = 'bold 13px monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText(pu.name, bx + bw / 2, by + 52);

      ctx.font = '11px monospace';
      ctx.fillStyle = '#888';
      ctx.fillText(pu.desc, bx + bw / 2, by + 68);

      ctx.fillStyle = '#555';
      ctx.fillText(`[${i + 1}]`, bx + bw / 2, by + 84);
    }
  }

  // Wave end transition
  if (state === 'waveEnd') {
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#0f0';
    ctx.fillText('WAVE CLEARED!', cw / 2, ch / 2);
    ctx.font = '14px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText(`Next: Wave ${(wave % WAVES_PER_PHASE) + 1} — Phase ${phase + 1}`, cw / 2, ch / 2 + 25);
  }

  // Dead
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(255,0,0,0.1)';
    ctx.fillRect(a, aY, ARENA.w, ARENA.h);
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#f44';
    ctx.fillText('DESTROYED', cw / 2, ch / 2 - 10);
    ctx.font = '13px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('Boss is adapting...', cw / 2, ch / 2 + 15);
  }

  ctx.textAlign = 'left';
  ctx.restore();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
