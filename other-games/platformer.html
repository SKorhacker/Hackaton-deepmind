<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Platformer - AI vs Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: monospace; color: #fff; overflow: hidden; }
#header { display: flex; justify-content: space-between; width: 900px; padding: 8px 0; font-size: 14px; }
#header span { display: inline-block; min-width: 120px; }
canvas { border: 1px solid #333; display: block; }
#info { margin-top: 8px; font-size: 13px; color: #888; }
.ai-label { color: #0ff; }
.player-label { color: #0f0; }
.death-label { color: #f55; }
.gen-label { color: #ff0; }
</style>
</head>
<body>

<div id="header">
  <span class="ai-label">AI Distance: <b id="aiScore">0</b></span>
  <span class="gen-label">AI Brain: <b id="aiGen">gen 0</b> | data: <b id="aiData">0</b></span>
  <span class="death-label">Deaths: <b id="deathCount">0</b></span>
  <span class="player-label">Player Distance: <b id="playerScore">0</b></span>
</div>
<canvas id="game" width="900" height="700"></canvas>
<div id="info">Arrow keys / WASD to move | Space / Up to jump | AI learns from your deaths</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 700, HALF = H / 2;
const GRAVITY = 0.5;
const JUMP_FORCE = -10;
const MOVE_SPEED = 4;
const SCROLL_SPEED_BASE = 2;

// --- Neural Net ---
class NeuralNet {
  constructor(inputSize, hiddenSize, outputSize) {
    this.inputSize = inputSize;
    this.hiddenSize = hiddenSize;
    this.outputSize = outputSize;
    this.wh = this.randMat(hiddenSize, inputSize);
    this.bh = new Float32Array(hiddenSize);
    this.wo = this.randMat(outputSize, hiddenSize);
    this.bo = new Float32Array(outputSize);
    this.trainingData = [];
  }

  randMat(rows, cols) {
    const m = [];
    for (let i = 0; i < rows; i++) {
      m[i] = new Float32Array(cols);
      for (let j = 0; j < cols; j++) m[i][j] = (Math.random() - 0.5) * 0.5;
    }
    return m;
  }

  forward(input) {
    const hidden = new Float32Array(this.hiddenSize);
    for (let i = 0; i < this.hiddenSize; i++) {
      let s = this.bh[i];
      for (let j = 0; j < this.inputSize; j++) s += this.wh[i][j] * input[j];
      hidden[i] = Math.max(0, s);
    }
    const output = new Float32Array(this.outputSize);
    for (let i = 0; i < this.outputSize; i++) {
      let s = this.bo[i];
      for (let j = 0; j < this.hiddenSize; j++) s += this.wo[i][j] * hidden[j];
      output[i] = s;
    }
    return output;
  }

  addSample(state, action, good) {
    this.trainingData.push({ state: new Float32Array(state), action, good });
    if (this.trainingData.length > 600) this.trainingData.shift();
  }

  train(iterations = 40) {
    if (this.trainingData.length < 5) return;
    const lr = 0.008;

    for (let iter = 0; iter < iterations; iter++) {
      const sample = this.trainingData[Math.floor(Math.random() * this.trainingData.length)];
      const input = sample.state;

      const hidden = new Float32Array(this.hiddenSize);
      for (let i = 0; i < this.hiddenSize; i++) {
        let s = this.bh[i];
        for (let j = 0; j < this.inputSize; j++) s += this.wh[i][j] * input[j];
        hidden[i] = Math.max(0, s);
      }
      const output = new Float32Array(this.outputSize);
      for (let i = 0; i < this.outputSize; i++) {
        let s = this.bo[i];
        for (let j = 0; j < this.hiddenSize; j++) s += this.wo[i][j] * hidden[j];
        output[i] = s;
      }

      const target = new Float32Array(output);
      if (sample.good) {
        target[sample.action] += 1.0;
      } else {
        target[sample.action] -= 1.0;
        for (let i = 0; i < this.outputSize; i++) {
          if (i !== sample.action) target[i] += 0.25;
        }
      }

      const oErr = new Float32Array(this.outputSize);
      for (let i = 0; i < this.outputSize; i++) oErr[i] = target[i] - output[i];

      const hErr = new Float32Array(this.hiddenSize);
      for (let i = 0; i < this.outputSize; i++) {
        for (let j = 0; j < this.hiddenSize; j++) {
          this.wo[i][j] += lr * oErr[i] * hidden[j];
          hErr[j] += this.wo[i][j] * oErr[i];
        }
        this.bo[i] += lr * oErr[i];
      }
      for (let i = 0; i < this.hiddenSize; i++) {
        if (hidden[i] <= 0) continue;
        for (let j = 0; j < this.inputSize; j++) {
          this.wh[i][j] += lr * hErr[i] * input[j];
        }
        this.bh[i] += lr * hErr[i];
      }
    }
  }
}

// 10 inputs: on_ground, vy, dist_to_gap, gap_width, dist_to_spike, spike_height,
//            platform_height_ahead, x_position, dist_to_next_platform, height_diff_next
// 3 outputs: jump, move_left, move_right
const brain = new NeuralNet(10, 24, 3);

// --- Level Generation ---
const TILE = 30;
const PLATFORM_Y_PLAYER = HALF + HALF * 0.7; // default platform Y in player area
const PLATFORM_Y_AI = HALF * 0.7; // default platform Y in AI area

class Level {
  constructor(yBase, areaTop, areaBottom) {
    this.yBase = yBase;
    this.areaTop = areaTop;
    this.areaBottom = areaBottom;
    this.platforms = [];
    this.spikes = [];
    this.scrollX = 0;
    this.generateInitial();
  }

  generateInitial() {
    // Starting platform
    for (let x = 0; x < W + 400; x += 1) {
      this.extendLevel(x);
    }
  }

  extendLevel(worldX) {
    // Check if we already have content here
    const lastPlat = this.platforms[this.platforms.length - 1];
    if (lastPlat && lastPlat.x + lastPlat.w > worldX) return;

    const gapChance = 0.15 + playerDeaths * 0.01;
    const spikeChance = 0.1 + playerDeaths * 0.015;

    // Platform
    const platW = Math.max(80, 200 - playerDeaths * 5 + Math.random() * 100);
    const heightVar = Math.min(60, playerDeaths * 3);
    const platY = this.yBase + (Math.random() - 0.5) * heightVar;
    const startX = lastPlat ? lastPlat.x + lastPlat.w : 0;

    // Gap before platform
    let gap = 0;
    if (startX > W && Math.random() < gapChance) {
      gap = 40 + Math.random() * (30 + playerDeaths * 3);
      gap = Math.min(gap, 120);
    }

    this.platforms.push({
      x: startX + gap,
      y: platY,
      w: platW,
      h: TILE
    });

    // Spikes on platform
    if (startX > W * 0.5 && Math.random() < spikeChance) {
      const spikeX = startX + gap + 20 + Math.random() * (platW - 40);
      this.spikes.push({
        x: spikeX,
        y: platY - 15,
        w: 16,
        h: 15
      });
    }
  }

  cleanup() {
    this.platforms = this.platforms.filter(p => p.x + p.w - this.scrollX > -100);
    this.spikes = this.spikes.filter(s => s.x - this.scrollX > -100);
  }
}

// --- Player / Entity ---
class Entity {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.w = 20; this.h = 28;
    this.onGround = false;
    this.alive = true;
    this.respawnTimer = 0;
    this.startX = x; this.startY = y;
    this.distance = 0;
  }
  reset(level) {
    this.x = this.startX;
    this.y = this.startY;
    this.vx = 0; this.vy = 0;
    this.alive = true;
    this.onGround = false;
    this.respawnTimer = 0;
    this.distance = 0;
    level.scrollX = 0;
    level.platforms = [];
    level.spikes = [];
    level.generateInitial();
  }
}

let playerDeaths = 0;
let frameCount = 0;
let scrollSpeed = SCROLL_SPEED_BASE;

const playerLevel = new Level(PLATFORM_Y_PLAYER, HALF, H);
const aiLevel = new Level(PLATFORM_Y_AI, 0, HALF);

const player = new Entity(100, PLATFORM_Y_PLAYER - 40);
const ai = new Entity(100, PLATFORM_Y_AI - 40);

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// --- State for AI ---
let recentStates = [];
let recentActions = [];

function getState(entity, level) {
  const state = new Float32Array(10);
  const sx = level.scrollX;

  state[0] = entity.onGround ? 1 : 0;
  state[1] = entity.vy / 10;
  state[2] = (entity.x - 100) / W; // relative X position

  // Look ahead for gaps and spikes
  const lookAhead = entity.x + sx;
  let nearestGapDist = 300;
  let nearestGapWidth = 0;
  let nearestSpikeDist = 300;
  let nextPlatDist = 300;
  let nextPlatHeightDiff = 0;
  let groundBelow = 0;

  // Check platforms ahead
  for (let i = 0; i < level.platforms.length - 1; i++) {
    const p = level.platforms[i];
    const next = level.platforms[i + 1];
    const pEnd = p.x - sx + p.w;
    const nextStart = next.x - sx;

    // Gap between platforms
    if (pEnd > entity.x && pEnd < entity.x + 300) {
      const gapDist = pEnd - entity.x;
      const gapW = nextStart - pEnd;
      if (gapW > 5 && gapDist < nearestGapDist) {
        nearestGapDist = gapDist;
        nearestGapWidth = gapW;
        nextPlatDist = nextStart - entity.x;
        nextPlatHeightDiff = (next.y - p.y) / 100;
      }
    }

    // Check if entity is above this platform
    if (entity.x >= p.x - sx && entity.x <= p.x - sx + p.w) {
      groundBelow = 1;
    }
  }

  // Check spikes ahead
  for (const s of level.spikes) {
    const sd = (s.x - sx) - entity.x;
    if (sd > 0 && sd < nearestSpikeDist) {
      nearestSpikeDist = sd;
    }
  }

  state[3] = nearestGapDist / 300;
  state[4] = nearestGapWidth / 120;
  state[5] = nearestSpikeDist / 300;
  state[6] = nextPlatDist / 300;
  state[7] = nextPlatHeightDiff;
  state[8] = groundBelow;
  state[9] = scrollSpeed / 5;

  return state;
}

function encodeAction(jump, left, right) {
  if (jump) return 0;
  if (left) return 1;
  if (right) return 2;
  return 2; // default: move right
}

// --- Physics ---
function updateEntity(entity, level, areaTop, areaBottom) {
  if (!entity.alive) return;

  // Gravity
  entity.vy += GRAVITY;
  entity.y += entity.vy;
  entity.x += entity.vx;

  // Scroll
  level.scrollX += scrollSpeed;
  entity.distance += scrollSpeed;

  // Extend level
  const furthest = level.scrollX + W + 400;
  level.extendLevel(furthest);

  // Platform collision
  entity.onGround = false;
  for (const p of level.platforms) {
    const px = p.x - level.scrollX;
    const py = p.y;

    if (entity.x + entity.w / 2 > px && entity.x - entity.w / 2 < px + p.w) {
      if (entity.y + entity.h / 2 > py && entity.y + entity.h / 2 < py + p.h + 10 && entity.vy >= 0) {
        entity.y = py - entity.h / 2;
        entity.vy = 0;
        entity.onGround = true;
      }
    }
  }

  // Spike collision
  for (const s of level.spikes) {
    const sx = s.x - level.scrollX;
    if (entity.x + entity.w / 2 > sx && entity.x - entity.w / 2 < sx + s.w &&
        entity.y + entity.h / 2 > s.y && entity.y - entity.h / 2 < s.y + s.h) {
      return 'spike';
    }
  }

  // Fall off screen
  if (entity.y > areaBottom + 50) {
    return 'fall';
  }

  // Left edge death (scrolled off)
  if (entity.x < -20) {
    return 'left';
  }

  level.cleanup();
  return null;
}

// --- Main Loop ---
function update() {
  frameCount++;
  scrollSpeed = SCROLL_SPEED_BASE + playerDeaths * 0.1;
  scrollSpeed = Math.min(scrollSpeed, 5);

  // --- Player ---
  if (player.alive) {
    let jump = false, left = false, right = false;
    if (keys['ArrowLeft'] || keys['a']) { player.vx = -MOVE_SPEED; left = true; }
    else if (keys['ArrowRight'] || keys['d']) { player.vx = MOVE_SPEED; right = true; }
    else { player.vx = 0; }

    if ((keys['ArrowUp'] || keys['w'] || keys[' ']) && player.onGround) {
      player.vy = JUMP_FORCE;
      jump = true;
    }

    const action = encodeAction(jump, left, right);
    const state = getState(player, playerLevel);
    recentStates.push(state);
    recentActions.push(action);
    if (recentStates.length > 60) { recentStates.shift(); recentActions.shift(); }

    const death = updateEntity(player, playerLevel, HALF, H);
    if (death) {
      player.alive = false;
      player.respawnTimer = 90;
      playerDeaths++;
      document.getElementById('deathCount').textContent = playerDeaths;

      // Feed to AI
      for (let i = 0; i < recentStates.length; i++) {
        if (i >= recentStates.length - 8) {
          brain.addSample(recentStates[i], recentActions[i], false);
        } else {
          brain.addSample(recentStates[i], recentActions[i], true);
        }
      }
      brain.train(60 + playerDeaths * 15);
      recentStates = [];
      recentActions = [];

      document.getElementById('aiGen').textContent = `gen ${playerDeaths}`;
      document.getElementById('aiData').textContent = brain.trainingData.length;
    }

    document.getElementById('playerScore').textContent = Math.floor(player.distance / 10);
  } else {
    player.respawnTimer--;
    if (player.respawnTimer <= 0) player.reset(playerLevel);
  }

  // --- AI ---
  if (ai.alive) {
    const aiState = getState(ai, aiLevel);
    const output = brain.forward(aiState);

    // Interpret outputs
    const shouldJump = output[0] > 0.3 && ai.onGround;
    const goLeft = output[1] > output[2] && output[1] > 0.3;
    const goRight = output[2] > output[1] || (!goLeft);

    if (shouldJump) ai.vy = JUMP_FORCE;
    if (goLeft) ai.vx = -MOVE_SPEED;
    else if (goRight) ai.vx = MOVE_SPEED * 0.5; // Move forward by default
    else ai.vx = 0;

    // Small random exploration
    if (Math.random() < 0.02 && ai.onGround) {
      ai.vy = JUMP_FORCE; // Random jumps
    }

    const death = updateEntity(ai, aiLevel, 0, HALF);
    if (death) {
      ai.alive = false;
      ai.respawnTimer = 60;
    }

    document.getElementById('aiScore').textContent = Math.floor(ai.distance / 10);
  } else {
    ai.respawnTimer--;
    if (ai.respawnTimer <= 0) ai.reset(aiLevel);
  }
}

// --- Render ---
function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawEntity(entity, color, areaTop) {
  if (!entity.alive) return;
  ctx.fillStyle = color;
  ctx.fillRect(entity.x - entity.w / 2, entity.y - entity.h / 2, entity.w, entity.h);

  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(entity.x - 5, entity.y - entity.h / 2 + 5, 4, 4);
  ctx.fillRect(entity.x + 2, entity.y - entity.h / 2 + 5, 4, 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(entity.x - 4, entity.y - entity.h / 2 + 6, 2, 2);
  ctx.fillRect(entity.x + 3, entity.y - entity.h / 2 + 6, 2, 2);
}

function drawLevel(level, areaTop, areaBottom, platColor, spikeColor) {
  // Clip to area
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, areaTop, W, areaBottom - areaTop);
  ctx.clip();

  // Background grid
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 0.5;
  for (let x = -(level.scrollX % 50); x < W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, areaTop); ctx.lineTo(x, areaBottom); ctx.stroke();
  }

  // Platforms
  for (const p of level.platforms) {
    const px = p.x - level.scrollX;
    if (px + p.w < -10 || px > W + 10) continue;

    ctx.fillStyle = platColor;
    ctx.fillRect(px, p.y, p.w, p.h);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(px, p.y, p.w, p.h);

    // Grass top
    ctx.fillStyle = '#2a5';
    ctx.fillRect(px, p.y, p.w, 3);
  }

  // Spikes
  for (const s of level.spikes) {
    const sx = s.x - level.scrollX;
    if (sx < -20 || sx > W + 20) continue;

    ctx.fillStyle = spikeColor;
    ctx.beginPath();
    ctx.moveTo(sx, s.y + s.h);
    ctx.lineTo(sx + s.w / 2, s.y);
    ctx.lineTo(sx + s.w, s.y + s.h);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

function render() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Draw levels
  drawLevel(aiLevel, 0, HALF, '#335', '#f55');
  drawLevel(playerLevel, HALF, H, '#353', '#f55');

  // Draw entities
  drawEntity(ai, '#0ff', 0);
  drawEntity(player, '#0f0', HALF);

  // Divider
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 4]);
  ctx.beginPath();
  ctx.moveTo(0, HALF);
  ctx.lineTo(W, HALF);
  ctx.stroke();
  ctx.setLineDash([]);

  // Labels
  ctx.font = '14px monospace';
  ctx.fillStyle = '#0ff';
  ctx.fillText('AI', 10, 20);
  ctx.fillStyle = '#0f0';
  ctx.fillText('PLAYER', 10, HALF + 20);

  // Difficulty
  ctx.fillStyle = '#f55';
  ctx.font = '12px monospace';
  const diff = (1 + playerDeaths * 0.15).toFixed(1);
  ctx.fillText(`speed: x${diff}`, W - 130, HALF + 20);

  // Death messages
  if (!player.alive) {
    ctx.fillStyle = 'rgba(255, 0, 0, 0.15)';
    ctx.fillRect(0, HALF, W, HALF);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('DEAD - AI IS LEARNING...', W / 2, HALF + HALF / 2);
    ctx.font = '14px monospace';
    ctx.fillText(`Respawn in ${Math.ceil(player.respawnTimer / 30)}...`, W / 2, HALF + HALF / 2 + 30);
    ctx.textAlign = 'left';
  }
  if (!ai.alive) {
    ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
    ctx.fillRect(0, 0, W, HALF);
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
